name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Build Linux Zig prebuilts
        run: scripts/build-zig-linux.sh

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Build Android Zig prebuilts
        run: scripts/build-zig-android.sh

      - name: Verify Android prebuilts
        run: scripts/check-prebuilts-platform.sh android

      - name: Build Android example
        run: |
          cd example
          flutter pub get
          flutter build apk --debug

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android hash smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: example
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: flutter test integration_test/hash_smoke_test.dart -d emulator-5554

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Build iOS Zig prebuilts
        run: scripts/build-zig-ios.sh

      - name: Verify iOS prebuilts
        run: scripts/check-prebuilts-platform.sh ios

      - name: Build iOS example
        run: |
          cd example
          flutter pub get
          flutter build ios --debug --no-codesign

      - name: Run iOS hash smoke test
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "${device_id}" ]]; then
            echo 'No available iPhone Simulator found.' >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcrun simctl boot "${device_id}" 2>/dev/null || true
          xcrun simctl bootstatus "${device_id}" -b
          cd example
          flutter test integration_test/hash_smoke_test.dart -d "${device_id}"

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Build macOS Zig prebuilts
        run: scripts/build-zig-macos.sh

      - name: Verify macOS prebuilts
        run: scripts/check-prebuilts-platform.sh macos

      - name: Build macOS example
        run: |
          flutter config --enable-macos-desktop
          cd example
          flutter pub get
          flutter build macos --debug

      - name: Build macOS example (Release)
        run: |
          set -o pipefail
          cd example
          build_log="$RUNNER_TEMP/flutter-macos-release.log"
          flutter build macos --release 2>&1 | tee "$build_log"
          if grep -Fq 'different framework names for different architectures' "$build_log"; then
            echo 'Flutter reported inconsistent code asset framework names.' >&2
            exit 1
          fi

      - name: Run macOS hash smoke test
        run: |
          flutter config --enable-macos-desktop
          cd example
          flutter test integration_test/hash_smoke_test.dart -d macos

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Build Linux Zig prebuilts
        run: scripts/build-zig-linux.sh

      - name: Verify Linux prebuilts
        run: scripts/check-prebuilts-platform.sh linux

      - name: Build Linux example
        run: |
          flutter config --enable-linux-desktop
          cd example
          flutter pub get
          flutter build linux --debug

      - name: Run Linux hash smoke test
        run: |
          cd example
          xvfb-run -a flutter test integration_test/hash_smoke_test.dart -d linux

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Build Windows Zig prebuilts
        shell: bash
        run: scripts/build-zig-windows.sh

      - name: Verify Windows prebuilts
        shell: bash
        run: scripts/check-prebuilts-platform.sh windows

      - name: Build Windows example
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          cd example
          flutter pub get
          flutter build windows --debug

      - name: Run Windows hash smoke test
        shell: pwsh
        run: |
          Set-Location example
          flutter test integration_test/hash_smoke_test.dart -d windows

  verify-prebuilts:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Build Android prebuilts
        run: scripts/build-zig-android.sh

      - name: Build iOS prebuilts
        run: scripts/build-zig-ios.sh

      - name: Build macOS prebuilts
        run: scripts/build-zig-macos.sh

      - name: Build Linux prebuilts
        run: scripts/build-zig-linux.sh

      - name: Build Windows prebuilts
        run: scripts/build-zig-windows.sh

      - name: Check expected prebuilt files
        run: scripts/check-prebuilts.sh
