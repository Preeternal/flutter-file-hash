name: flutter_file_hash
description: "Native Flutter file and string hashing powered by Zig, with SHA, MD5, HMAC, BLAKE3, XXH3, cancellation, mmap, and Android content:// support."
version: 0.0.4
repository: https://github.com/Preeternal/flutter-file-hash

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  hooks: ^2.2.0

dev_dependencies:
  ffigen: ^22.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  plugin:
    platforms:
      android:
        package: com.preeternal.flutter_file_hash
        pluginClass: FlutterFileHashPlugin
        ffiPlugin: true
